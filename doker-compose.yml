version: '3.8'

networks:
  mesh_network:
    driver: bridge

services:
  # --- Service Ingress Gateway Node ---
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: ex_service_mesh_router:latest
    container_name: mesh_gateway_node
    hostname: gateway.mesh.local
    environment:
      - MIX_ENV=prod
      - GATEWAY_PORT=4000
      # Native Elixir Release environment configuration hooks:
      - RELEASE_DISTRIBUTION=name
      - RELEASE_NODE=router_node@gateway.mesh.local
      - RELEASE_COOKIE=mesh_secure_token_123
    ports:
      - "4000:4000"
    networks:
      mesh_network:
        aliases:
          - gateway.mesh.local
    # Invokes the compiled, optimized gateway production binary directly
    command: /app/releases/ex_service_mesh_router/bin/ex_service_mesh_router start

  # --- Microservice Application Node A (Auth) ---
  auth_app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ex_service_mesh_router:latest
    container_name: auth_app_node
    hostname: auth.mesh.local
    environment:
      - MIX_ENV=prod
      - NODE_IP=auth.mesh.local
      - GATEWAY_NODE=router_node@gateway.mesh.local
      - APP_NAME=auth_app
      - PORT=4002
      # Native Elixir Release environment configuration hooks:
      - RELEASE_DISTRIBUTION=name
      - RELEASE_NODE=auth_app_node@auth.mesh.local
      - RELEASE_COOKIE=mesh_secure_token_123
    networks:
      mesh_network:
        aliases:
          - auth.mesh.local
    depends_on:
      - gateway
    # Invokes the compiled auth application binary directly
    command: /app/releases/auth_app/bin/auth_app start

  # --- Microservice Application Node B (Chat) ---
  chat_app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ex_service_mesh_router:latest
    container_name: chat_app_node
    hostname: chat.mesh.local
    environment:
      - MIX_ENV=prod
      - NODE_IP=chat.mesh.local
      - GATEWAY_NODE=router_node@gateway.mesh.local
      - APP_NAME=chat_app
      - PORT=4003
      # Native Elixir Release environment configuration hooks:
      - RELEASE_DISTRIBUTION=name
      - RELEASE_NODE=chat_app_node@chat.mesh.local
      - RELEASE_COOKIE=mesh_secure_token_123
    networks:
      mesh_network:
        aliases:
          - chat.mesh.local
    depends_on:
      - gateway
    # Invokes the compiled chat application binary directly
    command: /app/releases/chat_app/bin/chat_app start
